spring:
  application:
    name: altstay-api
  # Local credentials, gitignored via .gitignore's `.env*`. `optional:` is load-bearing: a fresh
  # checkout with no credentials file must still start, or the offline test suite breaks for
  # everyone. Resolved relative to the working directory, i.e. backend/ when running mvnw here.
  config:
    import: optional:file:./.env.properties
  threads:
    virtual:
      enabled: true
  datasource:
    # No defaults, same fail-fast rule as GOOGLE_API_KEY. The URL must use the DIRECT Neon host
    # (no `-pooler`): tenancy binds the tenant to the connection with SET LOCAL, and a
    # transaction-mode pooler multiplexes sessions across backends. See phase-4-foundations.md §1.5.
    url: ${ALTSTAY_DB_URL}
    username: ${ALTSTAY_DB_USER}
    password: ${ALTSTAY_DB_PASSWORD}
    hikari:
      # Free-tier compute suspends when idle; a small pool avoids holding it awake needlessly.
      maximum-pool-size: 5
      # A wake-from-idle connect is seconds, not milliseconds. This is a cold start, not a fault.
      connection-timeout: 30000
  jpa:
    # Flyway owns the schema. `validate` makes a drift between entities and migrations a startup
    # failure rather than a silent ALTER — never `update`, which would let Hibernate quietly
    # rewrite a schema whose RLS policies it knows nothing about.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: ${ALTSTAY_MODEL:gemini-2.5-flash}
            temperature: 0.3
            max-output-tokens: 500
    retry:
      max-attempts: 0

altstay:
  concierge:
    max-history-turns: 20
    max-message-chars: 1000
    max-knowledge-base-chars: 20000
    escalation-contact: "the property manager"
    property-name: ${ALTSTAY_PROPERTY_NAME:AltStay Property}
    model-connect-timeout: 5s
    model-read-timeout: 20s
  cors:
    allowed-origins: ${ALTSTAY_ALLOWED_ORIGINS:http://localhost:3000}
  # Every key is required: RateLimitProperties is @Validated with no defaults and no repair, so a
  # missing or invalid value fails startup rather than silently becoming a working number.
  # RateLimitPropertiesBindingTest asserts THESE values, loading this file explicitly - the test
  # application.yaml replaces it on the test classpath, so nothing else here is covered by a test.
  rate-limit:
    anonymous-session-burst: 10
    anonymous-session-refill-duration: 6s
    anonymous-global-burst: 60
    anonymous-global-refill-duration: 1s
    authenticated-tenant-burst: 60
    authenticated-tenant-refill-duration: 1s
    max-entries: 10000
    entry-ttl: 1h

server:
  servlet:
    session:
      cookie:
        # Phase 4 §3.3 decided "an httpOnly session cookie". Previously left to servlet defaults,
        # which made a written decision rest on a default nobody had asserted.
        #
        # SameSite is NOT set here: src/test/resources/application.yaml replaces this file on the
        # test classpath, so anything set only here is untestable. It is a CookieSameSiteSupplier
        # bean in SecurityConfig instead, which AuthLoginIT asserts on the wire.
        http-only: true
        # Off by default so local http://localhost development works; must be true wherever the API
        # is reachable over anything but loopback.
        secure: ${ALTSTAY_COOKIE_SECURE:false}

logging:
  structured:
    format:
      console: ${ALTSTAY_LOG_FORMAT:}
  level:
    org.springframework.ai: INFO

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics
